name: TaskOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python manage.py test
        env:
          DEBUG: "True"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install --no-audit --no-fund && npm run build

  publish-images:
    # Build & push to Docker Hub only on pushes to main, after tests pass.
    # Repo secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskops-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskops-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-ec2:
    # Optional: runs only when repo variable DEPLOY_ENABLED=true.
    # Secrets: EC2_HOST, EC2_SSH_KEY (private key), plus the Docker Hub secrets above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          install -m 600 /dev/null key.pem
          printf '%s\n' "$EC2_SSH_KEY" > key.pem
          SSH="ssh -i key.pem -o StrictHostKeyChecking=accept-new ubuntu@$EC2_HOST"
          $SSH "mkdir -p ~/taskops"
          scp -i key.pem -o StrictHostKeyChecking=accept-new docker-compose.yml scripts/deploy.sh ubuntu@$EC2_HOST:~/taskops/
          $SSH "cd ~/taskops && DOCKERHUB_USER=$DOCKERHUB_USER IMAGE_TAG=latest sh deploy.sh"
          rm -f key.pem
